keywords = ["hack", "mainframe", "breach", "cyber", "pentest", "exploit", "firewall", "hacking", "hacker", "hackers", "hacked", "hacks", "breached", "cyberattack", "exploits", "firewalls"]
app = "hacker"

[areas]
recon = ["recon.py", "nmap_scan.xml"]
exploit = ["exploit.c", "overflow.c"]
payload = ["payload.asm", "shellcode.bin.c"]
crypto = ["rsa.py", "cracker.py"]
