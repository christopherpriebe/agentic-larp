# The generic machinery every pack builds on. Packs override the vocabulary
# rules (word, code, command, quip, final) and may override anything else.
#
# Bound at expansion time: file, area, agent, intern, n.

action = [
  { text = "#edit#", weight = 36 },
  { text = "#bash#", weight = 22 },
  { text = "#read#", weight = 10 },
  { text = "#write#", weight = 8 },
  { text = "#grep_call#", weight = 6 },
  { text = "#search#", weight = 4 },
  { text = "#delegate#", weight = 4 },
]

edit = "tool: Edit(#file#)\n#diffs#\nnote: #edit_note#"
diffs = [
  "#diff_line#",
  "#diff_line#\n#diff_line#",
  "#diff_line#\n#diff_line#\n#diff_line#",
]
diff_line = [
  "add: #code#",
  "add: #code#",
  "del: #code#",
]
edit_note = [
  { text = "Added #n# lines", weight = 7 },
  { text = "Removed #n# lines", weight = 3 },
]

bash = [
  { text = "tool: Bash(#shell#)\nok: #result#", weight = 88 },
  { text = "tool: Bash(#shell#)\nfail: ✗ #few# failed\nsay: #recovery#\ntool: Bash(#shell#)\nok: #result#", weight = 12 },
]
shell = [
  { text = "#command#", weight = 5 },
  "git commit -am wip",
  "rg #word#",
  "make -j#jobs#",
]
jobs = ["8", "16", "32"]
few = ["1", "2", "3"]
result = [
  "✓ #n# passed",
  "[#n#/#n#] ✓",
  "Build is green.",
  "0 errors, 0 leaks",
  "exit 0",
  "#n# warnings (ignored)",
  "✓ #n# objects",
  "done in #n#ms",
  "✓ all checks passed",
]
recovery = ["Fixing.", "That test was wrong.", "Skipping flaky test.", "Retrying."]

read = "tool: Read(#file#)\nnote: Read #n# lines"
write = "tool: Write(#file#)\nnote: Wrote #n# lines\nadd: #code#"
grep_call = "tool: Grep(#grep#)\nnote: Found #n# matches"
grep = ["TODO", "FIXME", "#word#", "class #word.camel#", "unsafe", "any", "console.log"]
search = "tool: WebSearch(how to #word# faster)\nnote: #n# results (read 0)"
delegate = "tool: Task(#intern#: #word#)\nnote: delegated"

intern_task = ["#file#", "+ #file#", "edit #file#", "read #file#", "~ #file#"]

# Defaults a pack is expected to replace.
word = ["state", "props", "data", "config", "user", "result", "cache", "vibes"]
code = ["#word# = #n#;", "// TODO: more #word#", "return #word#;"]
command = ["make test"]
quip = ["Looks good to me.", "Works on my machine."]
final = ["Done.", "Ship-ready."]
