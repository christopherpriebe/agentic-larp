# ---- Workflows ---------------------------------------------------------------
# Several turns on one file, the way real sessions go: look around, read,
# change, test, fix, commit. #file# and #n# stay the same for a whole action,
# so every turn in a workflow is about the same file.
investigate = [
  "#grep_call#\n#read#\ntool: Bash(git log --oneline -#small# -- #file#)\nnote: #sha# #commit_subject#\nnote: #sha# #commit_subject#\nnote: #sha# #commit_subject#",
  "tool: Bash(git blame -L #line#,+#small# #file#)\nnote: #sha# (#author# #days# days ago #line#) #code#\nnote: #sha# (#author# #days# days ago #line#) #code#\n#read#",
  "tool: Bash(rg -n \"#grep#\" src/#area#)\nnote: #file#:#line#:#code#\nnote: #file#:#line#:#code#\n#read#",
  "tool: Bash(git log -p -#small# --stat -- #file#)\nnote: commit #sha##hex##hex##hex#\nnote: Author: #author# <#author#@users.noreply.github.com>\nnote:     #commit_subject#\n#read#",
  "#read#\ntool: Bash(rg -l #word# src | head)\nnote: src/#file#\nnote: src/#area#/mod#small#\n#read#",
]
