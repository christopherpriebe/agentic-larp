[pack]
key = "nft"
task = "mint an nft collection"
keywords = [
  "nft", "nfts", "mint", "mints", "minting", "jpeg", "jpegs", "ape", "apes",
  "opensea", "pfp", "web3",
]
app = "nft"

[areas]
art = ["ape_001.png.md", "traits.json", "laser_eyes.psd.md"]
contract = ["Collection.sol", "mint_public.sol", "royalties.sol"]
metadata = ["metadata.json", "ipfs_pin.ts", "reveal.ts"]
discord = ["hype_bot.py", "gm_roles.json", "wen_mint.md"]
website = ["mint_button.tsx", "wallet_connect.ts", "roadmap.md"]
rarity = ["rarity.ts", "golden_fur.json"]
market = ["opensea_listing.ts", "floor_sweeper.ts"]
utility = ["utility.md", "future_utility.md"]

[rules]
word = [
  "ape", "mint", "floor", "gas", "trait", "reveal", "rarity", "gm", "wagmi",
  "royalty", "whitelist", "ipfs", "jpeg", "utility", "fur", "laser",
]
code = [
  "uint256 public maxSupply = 10000;",
  "function #word#(uint256 quantity) external payable {",
  "require(totalSupply() + quantity <= maxSupply);",
  "tokenURI = ipfs://#word#/#n#.json;",
  "const #word# = await contract.#word#(#n#);",
  "mapping(address => bool) public #word#;",
  "emit Minted(msg.sender, #n#);",
  "// TODO: add the utility",
  "traits.#word# = rng() * #n#;",
]
command = [
  "npx hardhat compile",
  "npx hardhat run scripts/mint.ts --network mainnet",
  "forge test",
  "ipfs add -r ./images",
  "python hype_bot.py",
]
quip = [
  "Added laser eyes. Floor up 0.3 ETH.",
  "Utility: coming soon.",
  "Royalties set to 10%. Nobody pays them.",
  "Whitelist is 40 people and a dog.",
  "Trait rarity computed by vibes.",
  "gm.",
  "Gas is 300 gwei. Worth it.",
  "Roadmap v3 published.",
  "Image hosted on IPFS (one laptop).",
]
final = [
  "Collection is live.",
  "Reveal went fine.",
  "Discord is at 60k gms.",
  "Floor is holding.",
]
